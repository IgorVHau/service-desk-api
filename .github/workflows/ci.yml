name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x mvnw
      
      - name: Executar build e testes
        run: ./mvnw --batch-mode clean verify

      - name: Salvar JAR como artifact
        uses: actions/upload-artifact@v7
        with:
          name: service-desk-api
          path: target/service-desk-api.jar

  docker:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Baixar JAR artifact
        uses: actions/download-artifact@v8
        with:
          name: service-desk-api
          path: target

      - name: Construir imagem Docker
        run: docker build -t service-desk-api .

      - name: Configurar credenciais AWS
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: sa-east-1
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: ServiceDeskAPI

      - name: Login no Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Taggear e publicar imagem no ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag service-desk-api:latest \
            ${{ steps.login-ecr.outputs.registry }}/service-desk-api:${{ github.sha }}
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/service-desk-api:${{ github.sha }}
